services:
  - type: web
    name: chacoaxis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8080
      - key: FRONTEND_ORIGINS
        value: https://chacoaxis.vercel.app,https://frontend-tan-two-78.vercel.app
      - key: API_ORIGIN_ENFORCEMENT
        value: true
      - key: API_RATE_LIMIT_ENABLED
        value: true
      - key: PAYMENTS_ENABLED
        value: false
    plan: free
    region: oregon
    autoDeploy: true
